[workspace]
resolver = "2"
members = [
    "crates/linkd-core",
    "crates/linkd-registry",
    "crates/linkd-sync",
    "crates/linkd-pack",
    "crates/linkd-watcher",
    "crates/linkd-ipc",
    "crates/linkd-adapters-npm",
    "crates/linkd-adapters-composer",
    "crates/linkd-adapters-python",
    "crates/linkd-adapters-go",
    "crates/linkd-adapters-cargo",
    "crates/linkd-adapters-jvm",
    "crates/linkd-adapters-dart",
    "crates/linkd-adapters-dotnet",
    "crates/linkd-adapters-ruby",
    "crates/linkd-adapters-swift",
    "crates/linkd-adapters-elixir",
    "crates/linkd-adapters",
    "crates/linkd-daemon",
    "crates/linkd-cli",
    "tests/integration",
]

[workspace.package]
version = "0.1.2"
edition = "2021"
license = "MIT"
authors = ["linkd contributors"]
repository = "https://github.com/pinoox/linkd"

[workspace.dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive", "env"] }
clap_complete = "4"
crossterm = "0.28"
directories = "5"
fd-lock = "4"
inquire = "0.7"
notify = "6"
ratatui = "0.29"
reflink-copy = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sysinfo = "0.32"
tempfile = "3"
thiserror = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }
walkdir = "2"

linkd-core = { path = "crates/linkd-core" }
linkd-registry = { path = "crates/linkd-registry" }
linkd-sync = { path = "crates/linkd-sync" }
linkd-pack = { path = "crates/linkd-pack" }
linkd-watcher = { path = "crates/linkd-watcher" }
linkd-ipc = { path = "crates/linkd-ipc" }
linkd-adapters-npm = { path = "crates/linkd-adapters-npm" }
linkd-adapters-composer = { path = "crates/linkd-adapters-composer" }
linkd-adapters-python = { path = "crates/linkd-adapters-python" }
linkd-adapters-go = { path = "crates/linkd-adapters-go" }
linkd-adapters-cargo = { path = "crates/linkd-adapters-cargo" }
linkd-adapters-jvm = { path = "crates/linkd-adapters-jvm" }
linkd-adapters-dart = { path = "crates/linkd-adapters-dart" }
linkd-adapters-dotnet = { path = "crates/linkd-adapters-dotnet" }
linkd-adapters-ruby = { path = "crates/linkd-adapters-ruby" }
linkd-adapters-swift = { path = "crates/linkd-adapters-swift" }
linkd-adapters-elixir = { path = "crates/linkd-adapters-elixir" }
linkd-adapters = { path = "crates/linkd-adapters" }
linkd-daemon = { path = "crates/linkd-daemon" }

[profile.release]
lto = true
codegen-units = 1
strip = true
