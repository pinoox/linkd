name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-binaries:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux x86_64 GNU
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary_name: linkd
            asset_name: linkd-x86_64-unknown-linux-gnu.tar.gz
          # Linux x86_64 MUSL (Fully static)
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            binary_name: linkd
            asset_name: linkd-x86_64-unknown-linux-musl.tar.gz
          # Linux ARM64 GNU
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            binary_name: linkd
            asset_name: linkd-aarch64-unknown-linux-gnu.tar.gz
            use_cross: true
          # macOS Intel
          - os: macos-13
            target: x86_64-apple-darwin
            binary_name: linkd
            asset_name: linkd-x86_64-apple-darwin.tar.gz
          # macOS Apple Silicon
          - os: macos-latest
            target: aarch64-apple-darwin
            binary_name: linkd
            asset_name: linkd-aarch64-apple-darwin.tar.gz
          # Windows x86_64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary_name: linkd.exe
            asset_name: linkd-x86_64-pc-windows-msvc.zip

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install musl tools (Linux musl)
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Install Cross (if cross-compiling)
        if: matrix.use_cross
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Build binary
        run: |
          if [ "${{ matrix.use_cross }}" = "true" ]; then
            cross build --release --target ${{ matrix.target }} -p linkd-cli
          else
            cargo build --release --target ${{ matrix.target }} -p linkd-cli
          fi
        shell: bash

      - name: Package archive (Unix)
        if: runner.os != 'Windows'
        run: |
          staging="linkd-${{ matrix.target }}"
          mkdir -p "$staging"
          cp "target/${{ matrix.target }}/release/${{ matrix.binary_name }}" "$staging/"
          cp README.md LICENSE "$staging/" 2>/dev/null || true
          tar czf "${{ matrix.asset_name }}" -C "$staging" .
          echo "SHA256=$(sha256sum ${{ matrix.asset_name }} | cut -d' ' -f1)" >> $GITHUB_ENV
        shell: bash

      - name: Package archive (Windows)
        if: runner.os == 'Windows'
        run: |
          $staging = "linkd-${{ matrix.target }}"
          New-Item -ItemType Directory -Path $staging -Force
          Copy-Item "target/${{ matrix.target }}/release/${{ matrix.binary_name }}" -Destination $staging/
          if (Test-Path README.md) { Copy-Item README.md -Destination $staging/ }
          if (Test-Path LICENSE) { Copy-Item LICENSE -Destination $staging/ }
          Compress-Archive -Path "$staging/*" -DestinationPath "${{ matrix.asset_name }}"
          $hash = (Get-FileHash -Path "${{ matrix.asset_name }}" -Algorithm SHA256).Hash.ToLower()
          Add-Content -Path $env:GITHUB_ENV -Value "SHA256=$hash"
        shell: pwsh

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: ${{ matrix.asset_name }}

  release:
    name: Create GitHub Release
    needs: build-binaries
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Generate Checksums
        run: |
          cd dist
          find . -type f \( -name "*.tar.gz" -o -name "*.zip" \) -exec sha256sum {} + > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*/*.tar.gz
            dist/*/*.zip
            dist/SHA256SUMS.txt
          draft: false
          prerelease: false
          generate_release_notes: true
